name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r frontend/requirements.txt
          pip install pytest

      - name: Lint
        run: ruff check backend frontend scripts

      - name: Format check
        run: ruff format --check backend frontend scripts

      - name: Backend tests
        run: python -m pytest
        working-directory: backend

      - name: Frontend tests
        run: python -m pytest
        working-directory: frontend


  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: |
          docker build -t fraudshield-backend ./backend
          docker build -t fraudshield-frontend ./frontend
